[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "narrative-regime-etf-allocation"
version = "0.1.0"
description = "Regime-conditioned narrative research for Chinese ETF allocation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Jiacheng Bie" },
]
dependencies = [
  "pandas>=2.1,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
akshare = ["akshare>=1.18,<2"]
yahoo = ["yfinance>=0.2.40,<1"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
nrea = "narrative_regime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_regime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["narrative_regime"]
branch = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
